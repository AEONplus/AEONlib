components:
    schemas:
        AddSingleToSnrBlockRequest:
            type: object
            properties:
                runid:
                    type: string
                    description: Unique identifier of the science program.
                snr_block_token:
                    type: string
                    description: Unique identifier of an existing SNR block to create the new observing group for.
                observing_group_token:
                    type: string
                    description: Unique identifier of the observing group. If an observing group target with this token already exists, it will be updated, otherwise it will be created. Must begin with the program token followed by a dash, e.g. 20AE01-0123456789
        AddSingleToSnrBlockResponse:
            type: object
            properties:
                success:
                    type: boolean
                error:
                    $ref: '#/components/schemas/Errors'
                snr_block:
                    $ref: '#/components/schemas/SnrBlockData'
                observing_group:
                    $ref: '#/components/schemas/ObservingGroupData'
        AllocationData:
            type: object
            properties:
                run_id:
                    type: string
                time_allocated_millis:
                    type: integer
                    format: int64
                tac_rank:
                    type: integer
                    format: int32
                tac_grade:
                    type: string
                instrument:
                    enum:
                        - UNKNOWN
                        - CFH12K
                        - MEGACAM
                        - WIRCAM
                        - ESPADONS
                        - SITELLE
                        - SPIROU
                        - WENAOKEAO
                    type: string
                    format: enum
                agency:
                    $ref: '#/components/schemas/AllocationData_Agency'
                cfht_rank:
                    type: integer
                    format: int32
        AllocationData_Agency:
            type: object
            properties:
                letter:
                    type: string
                name:
                    type: string
        BigInteger:
            type: object
            properties:
                value:
                    type: string
            description: Used for primary database fields in sybase Should be parsed as a BigInteger
        CatalogIdentifier:
            type: object
            properties:
                catalog:
                    type: string
                    description: Catalog to reference.
                identifier:
                    type: string
                    description: 'Valid identifier in the catalog. Note: this ID will contain a catalog name, because spacing matters in catalogs, the full ID for an object is like M    4. Catalog is M, id is identifier could be 4, but to reference m4, you need the spaces. NB: These identity values can not be set in fits headers because they do not have to conform to the length restrictions.'
            description: Ties to some external system. A string representation can take the form of <catalog>:<identifier>
        Config_Dithering:
            type: object
            properties:
                is_staring:
                    type: boolean
        Config_Nodding:
            type: object
            properties:
                start_sequence:
                    enum:
                        - OBJECT
                        - TARGET
                        - SKY
                        - DARK
                        - FLAT
                        - SNAP
                        - BIAS
                        - FOCUS
                        - ALIGN
                        - COMPARISON
                        - ACQUIRE
                        - FABRY_PEROT
                        - TWILIGHT_FLATS
                        - PHOTOMETRY
                        - SFOCUS
                    type: string
                    format: enum
                target_db:
                    type: number
                    format: double
        Constraint:
            type: object
            properties:
                image_quality:
                    $ref: '#/components/schemas/DoubleMinMax'
                sky_background_max:
                    type: number
                    format: double
                airmass_max:
                    type: number
                    format: double
                extinction_max:
                    type: number
                    format: double
                moon_distance_arc_length_min:
                    type: number
                    format: double
                photometric:
                    type: boolean
                name:
                    type: string
                sybase_cons_id:
                    $ref: '#/components/schemas/BigInteger'
                h2o_vapor_max:
                    type: number
                    format: double
                read_sky_background_name:
                    type: string
                sky_background_name:
                    type: string
            description: Part of observing_template_data - not stored on any table individually
        DoubleMinMax:
            type: object
            properties:
                min:
                    type: number
                    format: double
                max:
                    type: number
                    format: double
        DoubleValue:
            type: object
            properties:
                value:
                    type: number
                    description: The double value.
                    format: double
            description: Wrapper message for `double`. The JSON representation for `DoubleValue` is JSON number. Not recommended for use in new APIs, but still useful for legacy APIs and has no plan to be removed.
        Duration:
            type: object
            properties:
                millis:
                    type: integer
                    format: int64
                display_unit:
                    enum:
                        - DAYS
                        - HOURS
                        - MINUTES
                        - SECONDS
                    type: string
                    description: Only needed for rendering UI, should display the duration using the units specified. If unset, assume DAYS
                    format: enum
        DynamicExposureTimeLimit:
            type: object
            properties:
                minimum_multiplier:
                    type: number
                    format: float
                maximum_multiplier:
                    type: number
                    format: float
        EphemeridesUpdateRequest:
            type: object
            properties:
                runid:
                    type: string
                    description: Unique identifier of the science program.
                token:
                    type: string
                    description: Unique identifier of the target.
                ephemeris:
                    type: array
                    items:
                        $ref: '#/components/schemas/MovingTarget_Ephemeris'
                    description: List of ephemerides to set on the target.
        EphemeridesUpdateResponse:
            type: object
            properties:
                success:
                    type: boolean
                error:
                    $ref: '#/components/schemas/Errors'
                entity:
                    $ref: '#/components/schemas/TargetData'
        Errors:
            type: object
            properties:
                message:
                    type: array
                    items:
                        type: string
        EspadonsStatus_ExposureMeterProcessingResult:
            type: object
            properties:
                snr:
                    type: number
                    format: double
        EspadonsStatus_GuiderSeeingProcessingResult:
            type: object
            properties:
                guider_seeing:
                    type: number
                    format: double
        EspadonsStatus_UpenaProcessingResult:
            type: object
            properties:
                iq:
                    type: number
                    format: double
                h2o_column_density_from_telluric_lines:
                    type: number
                    format: double
                radial_velocity_corrections:
                    type: number
                    format: double
                snr_per_ccd_bin:
                    type: number
                    format: double
                snr_per_spec_bin:
                    type: number
                    format: double
                actual_wavelength:
                    type: number
                    format: double
                snr_per_ccd_bin_polar:
                    type: number
                    format: double
                snr_per_spec_bin_polar:
                    type: number
                    format: double
                h2o_mm_data:
                    $ref: '#/components/schemas/UpenaProcessingResult_h2o_mm'
        ExposureData:
            type: object
            properties:
                token:
                    type: string
                obsid:
                    type: string
                exposure_number:
                    type: integer
                    format: int32
                iteration:
                    type: integer
                    format: int32
                parent_exposure_token:
                    type: string
                exposure_status:
                    $ref: '#/components/schemas/ExposureData_ExposureStatus'
                observing_template:
                    $ref: '#/components/schemas/ObservingTemplateData'
                target:
                    $ref: '#/components/schemas/TargetData'
                observing_group_context:
                    $ref: '#/components/schemas/ObservingGroupContext'
                all_derivations_complete:
                    type: boolean
                    description: When false, there is data which is still being calculated for this exposure. Data can still be displayed, but the client should attempt to refresh the data.
                queue_run_id:
                    type: string
                camera_run_id:
                    type: string
                prg_run_id:
                    type: string
                observing_component_token:
                    type: string
                sub_totals:
                    $ref: '#/components/schemas/SubTotalsData'
                attribution:
                    $ref: '#/components/schemas/ExposureData_Attribution'
                version:
                    type: integer
                    description: 'Increments when this object updates storage: transient api_visibility: read only, incremented by the server'
                    format: int32
        ExposureData_Attribution:
            type: object
            properties:
                runid:
                    type: string
                observing_block_display_label:

                observing_template_token:
                    type: string
                    description: Unique identifier of the observing template used in this observing component. When creating or updating an observing group, this must be an existing observing template, or on the map of the request to be created.
                target_label:
                    type: integer
                    description: 'Label of the target used in this observing component. This value is only set on the read_observing_block. api_visibility: read only'
                    format: int32
                observing_template_label:
                    type: integer
                    description: 'Label of the observing template used in this observing component. This value is only set on the read_observing_block. api_visibility: read only'
